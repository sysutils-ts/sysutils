name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts --no-optional
      - run: npm install --ignore-scripts node-api-dotnet@0.9.21 --no-save -w packages/ps
      - run: npx nx run-many -t typecheck -p @sysutils/ps
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      - run: npx nx run-many -t test -p @sysutils/ps
        env:
          SYSUTILS_PS_TEST_NODEAPI: 1
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      - run: npx nx run-many -t test:dotnet -p @sysutils/ps
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      - run: npm run lint

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: filter
        with:
          filters: |
            native:
              - 'packages/ps/native/**'
              - 'packages/ps/scripts/build-native-all.ts'
              - 'packages/ps/scripts/build-native-all-base.ts'

  native:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'success' || needs.changes.result == 'skipped') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ github.event_name == 'pull_request' && needs.changes.outputs.native != 'true' && fromJSON('["linux-x64","linux-arm64"]') || fromJSON('["win-x64","win-arm64","linux-x64","linux-arm64","osx-x64","osx-arm64"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts --no-optional
      - run: node packages/ps/scripts/build-native-all.ts cli ${{ matrix.rid }}
      - run: node packages/ps/scripts/build-native-all.ts nodeapi ${{ matrix.rid }}
