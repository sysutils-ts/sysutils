name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts
      - run: npm run build:cli -w packages/ps
      - run: npm run build:nodeapi -w packages/ps
      - run: npm run build -w packages/ps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm install --ignore-scripts ps-list@9.0.0 --no-save -w packages/ps
      - run: npm test
        env:
          SYSUTILS_PS_TEST_NODEAPI: 1
      - run: npm run test:dotnet -w packages/ps

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: filter
        with:
          filters: |
            native:
              - 'packages/ps/native/**'
              - 'packages/ps/scripts/build-native-all.ts'
              - 'packages/ps/scripts/build-native-all-base.ts'

  native:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ github.event_name == 'pull_request' && needs.changes.outputs.native != 'true' && fromJSON('["linux-x64","linux-arm64"]') || fromJSON('["win-x64","win-arm64","linux-x64","linux-arm64","osx-x64","osx-arm64"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts
      - run: node packages/ps/scripts/build-native-all.ts cli ${{ matrix.rid }}
      - run: node packages/ps/scripts/build-native-all.ts nodeapi ${{ matrix.rid }}
